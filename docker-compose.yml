version: '3.8'

services:
  autoscaler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k8s-predictive-autoscaler
    ports:
      - "8000:8000"
    environment:
      - TF_ENABLE_ONEDNN_OPTS=0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: k8s-prometheus
    volumes:
      - ./deploy/k8s/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      autoscaler:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    container_name: k8s-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

